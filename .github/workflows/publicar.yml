# Publica el APK de Android en "Releases" al crear una etiqueta de versión (p. ej. v1.1.0)
# o al lanzarlo a mano desde la pestaña Actions.
#
# Si en Settings → Secrets and variables → Actions existen estos secretos, el APK sale firmado
# con vuestra llave de publicación (versión release, la que se actualiza sobre la app instalada):
#   NOBA_KEYSTORE_BASE64  (el archivo .jks codificado en Base64)
#   NOBA_KEYSTORE_PASSWORD, NOBA_KEY_ALIAS, NOBA_KEY_PASSWORD
# Si no existen, se publica un APK de prueba (debug), instalable en cualquier Android.
name: Publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la llave de firma (si existe)
        env:
          LLAVE: ${{ secrets.NOBA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LLAVE" ]; then
            echo "$LLAVE" | base64 --decode > "$RUNNER_TEMP/noba.jks"
            echo "NOBA_KEYSTORE_FILE=$RUNNER_TEMP/noba.jks" >> "$GITHUB_ENV"
            echo "TIPO=release" >> "$GITHUB_ENV"
          else
            echo "TIPO=debug" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          NOBA_KEYSTORE_PASSWORD: ${{ secrets.NOBA_KEYSTORE_PASSWORD }}
          NOBA_KEY_ALIAS: ${{ secrets.NOBA_KEY_ALIAS }}
          NOBA_KEY_PASSWORD: ${{ secrets.NOBA_KEY_PASSWORD }}
        run: |
          if [ "$TIPO" = "release" ]; then
            ./gradlew :androidApp:assembleRelease --stacktrace
            cp androidApp/build/outputs/apk/release/androidApp-release.apk NobaVolt.apk
          else
            ./gradlew :androidApp:assembleDebug --stacktrace
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk NobaVolt.apk
          fi

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ETIQUETA="${GITHUB_REF_NAME}"
          else
            ETIQUETA="prueba-${GITHUB_SHA::7}"
          fi
          if [ "$TIPO" = "release" ]; then
            NOTAS="APK de Noba Volt firmado con la llave de publicación. Se instala o actualiza sobre la versión anterior."
            PREVIA=""
          else
            NOTAS="APK de prueba de Noba Volt (firma de desarrollo). Si el móvil tiene instalada una versión firmada con la llave de publicación, desinstálala antes."
            PREVIA="--prerelease"
          fi
          gh release create "$ETIQUETA" NobaVolt.apk \
            --target "$GITHUB_SHA" \
            --title "Noba Volt ${ETIQUETA}" \
            --notes "$NOTAS" $PREVIA

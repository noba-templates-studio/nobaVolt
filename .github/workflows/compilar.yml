# Compila la app para Android y para iOS en los servidores de GitHub en cada cambio.
name: Compilar

on:
  push:
    branches: [ios, main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de prueba
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: noba-volt-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: Compilar código Kotlin para iOS
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace
      - name: PDF de prueba
        run: |
          ./gradlew :shared:iosSimulatorArm64Test --stacktrace
          mkdir -p revision
          F=$(find ~/Library/Developer/CoreSimulator /private/var/folders /tmp -name prueba_noba.pdf 2>/dev/null | head -1)
          echo "PDF encontrado en: $F"
          if [ -n "$F" ]; then cp "$F" revision/; fi
      - name: Compilar app iOS (simulador)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
      - name: Abrir en el simulador y hacer capturas
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone") and "Pro" in x["name"]))')
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/Build/Products/Debug-iphonesimulator/NobaVolt.app
          sleep 5
          xcrun simctl launch "$UDID" com.noba.volt
          sleep 0.3; xcrun simctl io "$UDID" screenshot revision/1_intro.png
          sleep 0.3; xcrun simctl io "$UDID" screenshot revision/2_intro.png
          sleep 4;   xcrun simctl io "$UDID" screenshot revision/3_inicio.png
          xcrun simctl terminate "$UDID" com.noba.volt
          xcrun simctl ui "$UDID" appearance dark
          sleep 2
          xcrun simctl launch "$UDID" com.noba.volt
          sleep 5;   xcrun simctl io "$UDID" screenshot revision/4_inicio_oscuro.png
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "NobaVolt"' --style compact > revision/registro.txt 2>&1 || true
      - name: Guardar capturas y PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noba-volt-ios-revision
          path: revision/
      - name: Publicar revisión en la rama revision-ci
        if: always() && github.event_name == 'push'
        run: |
          cp -r revision /tmp/revision
          cd /tmp/revision
          git init -q -b revision-ci
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Revisión automática de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" revision-ci

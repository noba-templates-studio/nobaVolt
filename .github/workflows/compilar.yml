# Compila la app para Android y para iOS en los servidores de GitHub en cada cambio.
name: Compilar

on:
  push:
    branches: [ios, main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de prueba
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: noba-volt-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: Compilar código Kotlin para iOS
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace
      - name: Compilar app iOS (simulador)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
